# Free Supabase projects pause after a week with no activity.
# This pings the database once a day so Open the Fridge never goes to sleep.
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL  = your Project URL
#   SUPABASE_KEY  = your publishable (anon) key
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 14 * * *'   # every day, 9:17am Eastern
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Add the SUPABASE_URL and SUPABASE_KEY secrets first."; exit 0; fi
          curl -fsS "$SUPABASE_URL/rest/v1/rpc/username_available" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{"name":"keepalive"}'
          echo " — database is awake"
